<body>
    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Sticky Header -->
    <header class="header">
        <div class="header-container">
            <div class="header-left">
                <a href="/" class="back-btn" title="Back to Home">←</a>
                <h1 class="header-title">
                    <span class="header-icon">📊</span>
                    <span class="header-text">Spending Report</span>
                </h1>
            </div>
            <div style="position: relative;">
                <button class="hamburger-btn" id="menuToggle" aria-label="Open Menu">
                    <span class="hamburger-bar"></span>
                    <span class="hamburger-bar"></span>
                    <span class="hamburger-bar"></span>
                </button>
                <div class="menu-dropdown" id="menuDropdown">
                    <button class="menu-item action-item" id="menuRefreshBtn" onclick="triggerRefreshFromMenu(event)">
                        <span id="menuRefreshIcon">🔄</span>
                        <span id="menuRefreshText">Refresh Data</span>
                    </button>
                    <div class="menu-divider"></div>
                    <a href="/" class="menu-item">
                        <span>🏡</span>
                        <span>Receipt Sync</span>
                    </a>
                    <a href="/fire" class="menu-item">
                        <span>🔥</span>
                        <span>FIRE Dashboard</span>
                    </a>
                    <div class="menu-divider"></div>
                    <a href="#" id="updateAppLink" class="menu-item">
                        <span>🔄</span>
                        <span>Update App</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Controls Bar -->
        <section class="controls-bar">
            <div class="year-selector" id="yearSelector">
                <!-- Year pills populated by JS -->
            </div>
            <div class="action-group">
                <div id="freshnessContainer">
                    <span class="freshness-pill">Checking freshness...</span>
                </div>
            </div>
        </section>

        <!-- Loading / Empty / Content Containers -->
        <div id="contentArea">
            <!-- Populated dynamically -->
        </div>
    </main>

    <script>
        // State
        const DEFAULT_YEARS = [2026, 2025, 2024];
        let currentYear = 2026;
        let availableYears = [...DEFAULT_YEARS];
        let reportData = null;
        let cachedPrevYearData = null;
        let selectedMonth = null;
        let annualSectionYear = 2026;
        let cachedAnnualReports = {};
        let categoryToGroupMap = {};
        let isSyncing = false;
        let pollTimer = null;
        let monthlyChart = null;
        let groupChart = null;
        let monthGroupChart = null;

        const MONTH_FULL_NAMES = ["", "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const MONTH_SHORT_NAMES = ["", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        // Toast Helper
        let toastTimeout = null;
        function showToast(message, type = 'success') {
            const toast = document.getElementById("toast");
            if (!toast) return;
            if (toastTimeout) clearTimeout(toastTimeout);

            toast.textContent = message;
            toast.className = "toast show " + type;

            toastTimeout = setTimeout(() => {
                toast.className = toast.className.replace("show", "").trim();
                toastTimeout = null;
            }, 3000);
        }

        // Colors for category groups
        const GROUP_COLORS = [
            '#6366f1', '#ec4899', '#10b981', '#f59e0b',
            '#3b82f6', '#8b5cf6', '#14b8a6', '#f43f5e',
            '#84cc16', '#a855f7', '#06b6d4', '#eab308'
        ];

        // Format Currency Helper
        function formatCurrency(val) {
            if (val === undefined || val === null || isNaN(val)) return '$0.00';
            return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Get Freshness Details & Pill HTML
        function getFreshnessDetails(isoStr, year) {
            const now = new Date();
            const realYear = now.getFullYear();
            const isClosedYear = year < realYear;

            if (!isoStr) {
                return {
                    status: 'unknown',
                    pillHtml: `<div class="freshness-pill">⚪ Not calculated yet</div>`
                };
            }

            const date = new Date(isoStr);
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / (1000 * 60));
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            let relativeStr = '';
            if (diffMins < 1) {
                relativeStr = 'Just now';
            } else if (diffMins < 60) {
                relativeStr = `${diffMins}m ago`;
            } else if (diffHours < 24) {
                relativeStr = `${diffHours}h ago`;
            } else if (diffDays === 1) {
                relativeStr = 'Yesterday';
            } else {
                relativeStr = `${diffDays}d ago`;
            }

            const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const exactTooltip = dateStr + ' at ' + date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

            if (isClosedYear) {
                return {
                    status: 'closed',
                    pillHtml: `
                        <div class="freshness-pill closed" title="Historical year snapshot saved on ${exactTooltip}">
                            <span class="freshness-dot" style="background: #8b5cf6;"></span>
                            <span>🔒 Snapshot: ${dateStr}</span>
                        </div>
                    `
                };
            }

            if (diffDays >= 7) {
                return {
                    status: 'stale',
                    pillHtml: `
                        <div class="freshness-pill stale" title="Calculated on ${exactTooltip}. Recalculation recommended.">
                            <span class="freshness-dot" style="background: #f59e0b;"></span>
                            <span>🟠 <b>Stale (${relativeStr})</b> · ${dateStr}</span>
                        </div>
                    `
                };
            } else if (diffDays >= 2) {
                return {
                    status: 'moderate',
                    pillHtml: `
                        <div class="freshness-pill moderate" title="Calculated on ${exactTooltip}">
                            <span class="freshness-dot" style="background: #60a5fa;"></span>
                            <span>🟡 Updated: <b>${relativeStr}</b> · ${dateStr}</span>
                        </div>
                    `
                };
            } else {
                return {
                    status: 'fresh',
                    pillHtml: `
                        <div class="freshness-pill fresh" title="Calculated on ${exactTooltip}">
                            <span class="freshness-dot" style="background: #10b981;"></span>
                            <span>🟢 Fresh (<b>${relativeStr}</b>) · ${dateStr}</span>
                        </div>
                    `
                };
            }
        }

        // Init App
        async function init() {
            // Check if returned from app update
            if (new URLSearchParams(window.location.search).get('updated') === '1') {
                showToast("✨ Updated to the latest version!", "success");
                const cleanUrl = new URL(window.location.href);
                cleanUrl.searchParams.delete('updated');
                cleanUrl.searchParams.delete('v');
                window.history.replaceState({}, '', cleanUrl.toString());
            }

            // Setup Hamburger Menu Toggle
            const toggle = document.getElementById('menuToggle');
            const dropdown = document.getElementById('menuDropdown');
            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('show');
            });
            document.addEventListener('click', () => {
                dropdown.classList.remove('show');
            });

            // Update App Logic
            const updateAppBtn = document.getElementById('updateAppLink');
            if (updateAppBtn) {
                updateAppBtn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    showToast("Updating app...", "success");
                    try {
                        if ('serviceWorker' in navigator) {
                            const registrations = await navigator.serviceWorker.getRegistrations();
                            for (let registration of registrations) {
                                await registration.unregister();
                            }
                        }
                        if ('caches' in window) {
                            const cacheNames = await caches.keys();
                            await Promise.all(cacheNames.map(name => caches.delete(name)));
                        }
                    } catch (err) {
                        console.error("Failed to clear app cache:", err);
                    }
                    await new Promise(r => setTimeout(r, 200));
                    const url = new URL('/spending', window.location.origin);
                    url.searchParams.set('v', Date.now());
                    url.searchParams.set('updated', '1');
                    window.location.href = url.toString();
                });
            }

            // Fetch list of years from database
            try {
                const res = await fetch('/api/spending/years');
                if (res.ok) {
                    const data = await res.json();
                    if (data.years && data.years.length > 0) {
                        const merged = [...new Set([...data.years, ...DEFAULT_YEARS])];
                        merged.sort((a, b) => b - a); // 2026, 2025, 2024
                        availableYears = merged;
                    }
                }
            } catch (e) {
                console.warn('Could not fetch distinct years', e);
            }

            renderYearSelector();
            await loadReport(currentYear);

            // Unified passive resize listener for all ECharts instances
            window.addEventListener('resize', () => {
                monthlyChart?.resize();
                groupChart?.resize();
                monthGroupChart?.resize();
            }, { passive: true });
        }

        // Render Year Selector Tabs
        function renderYearSelector() {
            const container = document.getElementById('yearSelector');
            container.innerHTML = '';
            availableYears.forEach(year => {
                const btn = document.createElement('button');
                btn.className = `year-btn ${year === currentYear ? 'active' : ''}`;
                btn.textContent = year;
                btn.onclick = () => switchYear(year);
                container.appendChild(btn);
            });
        }

        async function switchYear(year) {
            if (year === currentYear) return;
            currentYear = year;
            renderYearSelector();
            await loadReport(year);
        }

        // Load Report for Year
        async function loadReport(year) {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="empty-state">
                    <div class="spinner" style="width:36px; height:36px; border-width:3px; margin-bottom:1rem;"></div>
                    <div class="empty-title">Loading Spending Report for ${year}...</div>
                </div>
            `;

            try {
                const res = await fetch(`/api/spending?year=${year}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (data.status === 'not_found') {
                    renderEmptyState(year);
                    document.getElementById('freshnessContainer').innerHTML = `<span class="freshness-pill">⚪ Not calculated yet</span>`;
                    return;
                }

                reportData = data;
                cachedAnnualReports[year] = data;
                if (data.category_to_group) {
                    categoryToGroupMap = Object.assign({}, categoryToGroupMap, data.category_to_group);
                }
                annualSectionYear = year;
                const freshness = getFreshnessDetails(data.updated_at, year);
                document.getElementById('freshnessContainer').innerHTML = freshness.pillHtml;

                if (data.sync_status === 'syncing') {
                    setSyncingState(true);
                    startPolling();
                } else {
                    setSyncingState(false);
                }

                // Fetch previous year data for Y/Y comparison if available
                let prevYearData = null;
                try {
                    const prevRes = await fetch(`/api/spending?year=${year - 1}`);
                    if (prevRes.ok) {
                        const pData = await prevRes.json();
                        if (pData.status === 'ok') {
                            prevYearData = pData;
                            cachedAnnualReports[year - 1] = pData;
                            if (pData.category_to_group) {
                                categoryToGroupMap = Object.assign({}, categoryToGroupMap, pData.category_to_group);
                            }
                        }
                    }
                } catch (e) {
                    console.warn('Could not fetch previous year for Y/Y comparison', e);
                }

                cachedPrevYearData = prevYearData;
                await renderDashboard(data, prevYearData);

            } catch (err) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Error Loading Report</div>
                        <div class="empty-desc">${err.message}</div>
                        <button class="recalc-btn" style="margin:0 auto;" onclick="loadReport(${year})">Try Again</button>
                    </div>
                `;
            }
        }

        // Render Empty State
        function renderEmptyState(year) {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📊</div>
                    <div class="empty-title">No Report Calculated for ${year}</div>
                    <div class="empty-desc">Click below to fetch and analyze your transactions from Monarch Money in read-only mode.</div>
                    <button class="recalc-btn" style="margin: 0 auto; font-size:1rem; padding: 12px 24px;" onclick="triggerRecalculate()">
                        <span>🔄</span>
                        <span>Calculate ${year} Spending</span>
                    </button>
                </div>
            `;
        }

        // Render Full Dashboard
        async function renderDashboard(data, prevYearData = null) {
            const sum = data.summary || {};
            const catGroups = data.category_groups || {};
            const cats = data.categories || {};
            const monthly = data.monthly_spending || {};

            const totalExpense = sum.total_expense || 0;
            const totalIncome = sum.total_income || 0;
            const netSavings = sum.net_savings || 0;
            const savingsRate = (sum.savings_rate || 0) * 100;
            const txCount = sum.total_transactions || 0;

            const prevYear = currentYear - 1;
            const hasPrevYear = prevYearData && (prevYearData.summary?.total_expense || 0) > 0;

            // Determine default selectedMonth
            const months = Object.keys(monthly).sort();
            const now = new Date();
            const currentMonthPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            if (!selectedMonth || !months.includes(selectedMonth)) {
                if (months.includes(currentMonthPrefix)) {
                    selectedMonth = currentMonthPrefix;
                } else if (months.length > 0) {
                    selectedMonth = months[months.length - 1];
                } else {
                    selectedMonth = null;
                }
            }

            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <!-- KPI Grid -->
                <div class="kpi-grid">
                    <div class="kpi-card" style="--card-accent: #f43f5e;">
                        <div class="kpi-label">Total Spending (Net)</div>
                        <div class="kpi-value" style="color: #fda4af;">${formatCurrency(totalExpense)}</div>
                        <div class="kpi-sub">Excludes transfers & hidden</div>
                    </div>
                    <div class="kpi-card" style="--card-accent: #10b981;">
                        <div class="kpi-label">Total Income</div>
                        <div class="kpi-value" style="color: #6ee7b7;">${formatCurrency(totalIncome)}</div>
                        <div class="kpi-sub">Total recorded inflows</div>
                    </div>
                    <div class="kpi-card" style="--card-accent: #3b82f6;">
                        <div class="kpi-label">Net Savings</div>
                        <div class="kpi-value" style="color: #93c5fd;">${formatCurrency(netSavings)}</div>
                        <div class="kpi-sub">${savingsRate.toFixed(1)}% Savings Rate</div>
                    </div>
                    <div class="kpi-card" style="--card-accent: #8b5cf6;">
                        <div class="kpi-label">Transactions Analyzed</div>
                        <div class="kpi-value" style="color: #c4b5fd;">${txCount.toLocaleString()}</div>
                        <div class="kpi-sub">Non-hidden records in ${currentYear}</div>
                    </div>
                </div>

                <!-- Monthly Spending Trend Chart -->
                <div class="section-card">
                    <div class="section-title">
                        <span>📅 Monthly Spend</span>
                        <span id="monthlyAvgBadge" style="display:none; font-size:0.8rem; font-weight:600; color:#fbbf24; background:rgba(245,158,11,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(245,158,11,0.3);"></span>
                    </div>
                    <div id="monthlyChart" class="chart-container"></div>
                </div>

                <!-- Monthly Drill-Down Section -->
                <div class="section-card" id="monthlyDrillDownCard">
                    <div class="drilldown-header">
                        <div class="drilldown-header-left">
                            <span class="drilldown-title-full">🔍 Monthly Drill-Down</span>
                            <span class="drilldown-title-short">🔍 Monthly</span>
                            <span id="drillDownMonthBadge" class="month-active-badge"></span>
                        </div>
                        <div class="drilldown-header-right">
                            <button class="nav-month-btn" id="prevMonthBtn" onclick="stepMonth(-1)" title="Previous Month">‹</button>
                            <span id="drillDownSpendTotal" class="drilldown-total-spend" style="color:#fda4af;"></span>
                            <button class="nav-month-btn" id="nextMonthBtn" onclick="stepMonth(1)" title="Next Month">›</button>
                        </div>
                    </div>

                    <!-- Month Chips Carousel -->
                    <div class="month-chips-wrapper">
                        <div class="month-chips" id="monthChipsContainer"></div>
                    </div>

                    <!-- Category Groups Breakdown for Month -->
                    <div class="drilldown-grid">
                        <div id="monthGroupDonutChart" style="height: 280px; width:100%;"></div>
                        <div class="group-list" id="monthGroupListContainer"></div>
                    </div>

                    <!-- Ranked Categories for Selected Month -->
                    <div style="margin-top: 1.75rem; border-top: 1px solid var(--border); padding-top: 1.25rem;">
                        <div class="table-filter-bar" style="margin-bottom: 0.75rem;">
                            <span style="font-size:0.92rem; font-weight:600; color:var(--text-primary);">
                                🏆 Top Categories in <span id="monthSubCatTitle" style="color: #a5b4fc;"></span>
                            </span>
                            <input type="text" id="monthCategorySearch" class="search-input" style="max-width:220px;" placeholder="Search categories..." oninput="filterMonthCategories()">
                        </div>
                        <div style="overflow-x: auto; max-height: 320px;">
                            <table class="custom-table" style="font-size:0.88rem;">
                                <thead>
                                    <tr>
                                        <th style="width:40px;">#</th>
                                        <th>Category</th>
                                        <th style="text-align:right;">Spending</th>
                                        <th style="text-align:right;">% of Month</th>
                                    </tr>
                                </thead>
                                <tbody id="monthCategoryTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Annual Spending Breakdown & Ranked Categories Section -->
                <div class="section-card" id="annualCategoryGroupCard">
                    <div class="drilldown-header">
                        <div class="drilldown-header-left">
                            <span class="drilldown-title-full">🏷️ Annual Drill-Down</span>
                            <span class="drilldown-title-short">🏷️ Annual</span>
                            <span id="annualYearBadge" class="month-active-badge">${annualSectionYear}</span>
                            <span id="annualCatGroupSubtitle" class="drilldown-subtitle"></span>
                        </div>
                        <div class="drilldown-header-right">
                            <button class="nav-month-btn" id="prevYearBtn" onclick="stepAnnualYear(-1)" title="Previous Year">‹</button>
                            <span id="annualSpendTotal" class="drilldown-total-spend" style="color:#a5b4fc;"></span>
                            <button class="nav-month-btn" id="nextYearBtn" onclick="stepAnnualYear(1)" title="Next Year">›</button>
                        </div>
                    </div>

                    <!-- Year Chips Carousel -->
                    <div class="month-chips-wrapper">
                        <div class="month-chips" id="yearChipsContainer"></div>
                    </div>

                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; align-items:center;">
                        <div id="groupDonutChart" style="height: 280px; width:100%;"></div>
                        <div class="group-list" id="groupListContainer"></div>
                    </div>

                    <!-- Ranked Categories for Selected Year -->
                    <div style="margin-top: 1.75rem; border-top: 1px solid var(--border); padding-top: 1.25rem;">
                        <div class="table-filter-bar" style="margin-bottom: 0.75rem;">
                            <span style="font-size:0.92rem; font-weight:600; color:var(--text-primary);">
                                🏆 Top Categories in <span id="annualRankedCatsTitle" style="color: #a5b4fc;">${annualSectionYear}</span>
                            </span>
                            <input type="text" id="categorySearch" class="search-input" style="max-width:220px;" placeholder="Search categories..." oninput="filterCategories()">
                        </div>
                        <div style="overflow-x: auto; max-height: 420px;">
                            <table class="custom-table" style="font-size:0.88rem;">
                                <thead>
                                    <tr>
                                        <th style="width:40px;">#</th>
                                        <th>Category</th>
                                        <th style="text-align:right;">Spending</th>
                                        <th style="text-align:right;">% of Total</th>
                                    </tr>
                                </thead>
                                <tbody id="categoryTableBody">
                                    <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            // Render Charts & Monthly Drill-Down
            renderMonthlyChart(monthly, currentYear);
            renderMonthlyDrillDown();

            // Render Annual Category Group & Ranked Categories in-place
            await renderAnnualSection(annualSectionYear);
        }

        // Render Monthly Drill-Down
        function renderMonthlyDrillDown() {
            if (!reportData) return;
            const monthlySpending = reportData.monthly_spending || {};
            const months = Object.keys(monthlySpending).sort();
            const card = document.getElementById('monthlyDrillDownCard');
            if (!card) return;

            if (months.length === 0 || !selectedMonth) {
                card.style.display = 'none';
                return;
            }
            card.style.display = 'block';

            const [sYear, sMonth] = selectedMonth.split('-').map(Number);
            const monthFullName = MONTH_FULL_NAMES[sMonth] || `Month ${sMonth}`;
            const monthShortName = MONTH_SHORT_NAMES[sMonth] || `M${sMonth}`;
            const monthTotalSpend = monthlySpending[selectedMonth] || 0;

            // Header & Total
            const badge = document.getElementById('drillDownMonthBadge');
            if (badge) {
                badge.innerHTML = `<span class="badge-full">${monthFullName} ${sYear}</span><span class="badge-short">${monthShortName} '${String(sYear).slice(-2)}</span>`;
            }

            const totalEl = document.getElementById('drillDownSpendTotal');
            if (totalEl) totalEl.innerHTML = `<span class="total-prefix">Total: </span>${formatCurrency(monthTotalSpend)}`;

            const subTitle = document.getElementById('monthSubCatTitle');
            if (subTitle) subTitle.textContent = `${monthFullName} ${sYear}`;

            // Stepper Buttons
            const currIdx = months.indexOf(selectedMonth);
            const prevBtn = document.getElementById('prevMonthBtn');
            const nextBtn = document.getElementById('nextMonthBtn');
            if (prevBtn) prevBtn.disabled = (currIdx <= 0);
            if (nextBtn) nextBtn.disabled = (currIdx < 0 || currIdx >= months.length - 1);

            // Month Chips
            // Render Month Chips
            const chipsContainer = document.getElementById('monthChipsContainer');
            if (chipsContainer) {
                chipsContainer.innerHTML = '';
                months.forEach(m => {
                    const mNum = parseInt(m.substring(5), 10);
                    const isSelected = (m === selectedMonth);
                    const chip = document.createElement('button');
                    chip.className = `month-chip ${isSelected ? 'active' : ''}`;
                    chip.textContent = MONTH_SHORT_NAMES[mNum] || m;
                    chip.onclick = () => selectDrillDownMonth(m);
                    chipsContainer.appendChild(chip);

                    if (isSelected && chipsContainer.parentElement) {
                        const wrapper = chipsContainer.parentElement;
                        requestAnimationFrame(() => {
                            const chipLeft = chip.offsetLeft;
                            const chipWidth = chip.offsetWidth;
                            const wrapperWidth = wrapper.clientWidth;
                            wrapper.scrollTo({
                                left: chipLeft - (wrapperWidth / 2) + (chipWidth / 2),
                                behavior: 'smooth'
                            });
                        });
                    }
                });
            }

            // Determine Previous Month Data for M/M Comparison
            let prevMonthKey = null;
            let prevShortName = '';
            let prevMonthGroups = {};
            let hasPrevMonth = false;

            if (sMonth > 1) {
                prevMonthKey = `${sYear}-${String(sMonth - 1).padStart(2, '0')}`;
                prevShortName = MONTH_SHORT_NAMES[sMonth - 1];
                if (reportData.monthly_category_groups && reportData.monthly_category_groups[prevMonthKey]) {
                    prevMonthGroups = reportData.monthly_category_groups[prevMonthKey];
                    hasPrevMonth = true;
                } else if (reportData.monthly_spending && reportData.monthly_spending[prevMonthKey] !== undefined) {
                    hasPrevMonth = true;
                }
            } else if (sMonth === 1) {
                // January: compare to December of previous year
                prevMonthKey = `${sYear - 1}-12`;
                prevShortName = `Dec ${sYear - 1}`;
                if (cachedPrevYearData && cachedPrevYearData.monthly_category_groups && cachedPrevYearData.monthly_category_groups[prevMonthKey]) {
                    prevMonthGroups = cachedPrevYearData.monthly_category_groups[prevMonthKey];
                    hasPrevMonth = true;
                } else if (cachedPrevYearData && cachedPrevYearData.monthly_spending && cachedPrevYearData.monthly_spending[prevMonthKey] !== undefined) {
                    hasPrevMonth = true;
                }
            }

            // Category Groups for Selected Month
            const currMonthGroups = (reportData.monthly_category_groups && reportData.monthly_category_groups[selectedMonth]) || {};
            const sortedMonthGroups = Object.entries(currMonthGroups).sort((a, b) => b[1] - a[1]);

            const groupListContainer = document.getElementById('monthGroupListContainer');
            if (groupListContainer) {
                groupListContainer.innerHTML = '';
                if (sortedMonthGroups.length === 0) {
                    groupListContainer.innerHTML = '<div style="color:var(--text-muted); font-size:0.9rem; padding:1rem 0;">No category group spending recorded for this month.</div>';
                } else {
                    sortedMonthGroups.forEach(([name, amt], idx) => {
                        const pct = monthTotalSpend > 0 ? (amt / monthTotalSpend) * 100 : 0;
                        const color = GROUP_COLORS[idx % GROUP_COLORS.length];

                        let mmBadge = '';
                        if (hasPrevMonth) {
                            const prevAmt = prevMonthGroups[name] || 0;
                            const delta = amt - prevAmt;

                            if (Math.abs(delta) < 0.005) {
                                mmBadge = `, <span style="color:var(--text-muted); font-size:0.75rem;" title="${prevShortName}: ${formatCurrency(prevAmt)} ($0.00 change)">$0.00</span>`;
                            } else if (delta > 0) {
                                mmBadge = `, <span style="color:#10b981; font-weight:600; font-size:0.75rem;" title="${prevShortName}: ${formatCurrency(prevAmt)} (+${formatCurrency(delta)} vs ${prevShortName})">▲ +${formatCurrency(delta)}</span>`;
                            } else {
                                mmBadge = `, <span style="color:#f43f5e; font-weight:600; font-size:0.75rem;" title="${prevShortName}: ${formatCurrency(prevAmt)} (-${formatCurrency(Math.abs(delta))} vs ${prevShortName})">🔻-${formatCurrency(Math.abs(delta))}</span>`;
                            }
                        }

                        const item = document.createElement('div');
                        item.className = 'group-item';
                        item.innerHTML = `
                            <div class="group-header">
                                <span class="group-name">
                                    <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${color}; flex-shrink:0;"></span>
                                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${name}</span>
                                </span>
                                <div class="group-amount-wrap">
                                    <span class="group-amount-val">${formatCurrency(amt)}</span>
                                    <span class="group-amount-pct">(${pct.toFixed(1)}%${mmBadge})</span>
                                </div>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill" style="width: ${Math.min(pct, 100)}%; background: ${color};"></div>
                            </div>
                        `;
                        groupListContainer.appendChild(item);
                    });
                }
            }

            // Monthly Donut Chart
            renderMonthGroupDonutChart(sortedMonthGroups, prevMonthGroups, prevShortName, hasPrevMonth, monthTotalSpend);

            // Monthly Sub-categories Table
            const currMonthCats = (reportData.monthly_categories && reportData.monthly_categories[selectedMonth]) || {};
            const filterQuery = document.getElementById('monthCategorySearch')?.value || '';
            renderMonthCategoryTable(currMonthCats, monthTotalSpend, filterQuery);
        }

        // Render Month Donut Chart
        function renderMonthGroupDonutChart(sortedGroups, prevMonthGroups, prevShortName, hasPrevMonth, totalExpense) {
            const chartDom = document.getElementById('monthGroupDonutChart');
            if (!chartDom) return;
            if (monthGroupChart) monthGroupChart.dispose();
            monthGroupChart = echarts.init(chartDom);

            const data = sortedGroups.map(([name, value], idx) => ({
                name,
                value,
                itemStyle: { color: GROUP_COLORS[idx % GROUP_COLORS.length] }
            }));

            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: (p) => {
                        let res = `<b>${p.name}</b><br/>${formatCurrency(p.value)} (${p.percent}%)`;
                        if (hasPrevMonth) {
                            const prevAmt = prevMonthGroups[p.name] || 0;
                            const delta = p.value - prevAmt;
                            if (delta > 0.005) {
                                res += `<br/><span style="color:#10b981; font-size:0.85em;">▲ +${formatCurrency(delta)} vs ${prevShortName} (${formatCurrency(prevAmt)})</span>`;
                            } else if (delta < -0.005) {
                                res += `<br/><span style="color:#f43f5e; font-size:0.85em;">🔻-${formatCurrency(Math.abs(delta))} vs ${prevShortName} (${formatCurrency(prevAmt)})</span>`;
                            } else {
                                res += `<br/><span style="color:var(--text-muted); font-size:0.85em;">$0.00 vs ${prevShortName}</span>`;
                            }
                        }
                        return res;
                    }
                },
                series: [{
                    name: 'Month Category Group',
                    type: 'pie',
                    radius: ['45%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 6,
                        borderColor: '#0f0f1a',
                        borderWidth: 2
                    },
                    label: { show: false },
                    data: data
                }]
            };
            monthGroupChart.setOption(option);
        }

        // Render Month Ranked Categories Table
        function renderMonthCategoryTable(cats, monthTotalSpend, filterQuery = '') {
            const tbody = document.getElementById('monthCategoryTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            let sorted = Object.entries(cats).sort((a, b) => b[1] - a[1]);
            if (filterQuery.trim()) {
                const q = filterQuery.toLowerCase();
                sorted = sorted.filter(([name]) => {
                    const grp = (categoryToGroupMap[name] || '').toLowerCase();
                    return name.toLowerCase().includes(q) || grp.includes(q);
                });
            }

            if (sorted.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:1.5rem;">No matching categories found for this month</td></tr>`;
                return;
            }

            sorted.forEach(([name, amt], idx) => {
                const pct = monthTotalSpend > 0 ? (amt / monthTotalSpend) * 100 : 0;
                const groupName = categoryToGroupMap[name] || '';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="rank">${idx + 1}</td>
                    <td class="name">
                        <span>${name}</span>
                        ${groupName ? `<span class="cat-group-name">${groupName}</span>` : ''}
                    </td>
                    <td class="amount">${formatCurrency(amt)}</td>
                    <td class="pct">${pct.toFixed(1)}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterMonthCategories() {
            if (!reportData || !selectedMonth) return;
            const query = document.getElementById('monthCategorySearch').value;
            const monthlySpending = reportData.monthly_spending || {};
            const monthTotalSpend = monthlySpending[selectedMonth] || 0;
            const currMonthCats = (reportData.monthly_categories && reportData.monthly_categories[selectedMonth]) || {};
            renderMonthCategoryTable(currMonthCats, monthTotalSpend, query);
        }

        function selectDrillDownMonth(monthKey) {
            if (!monthKey || monthKey === selectedMonth) return;
            selectedMonth = monthKey;
            renderMonthlyDrillDown();
            updateMonthlyChartSelection();
        }

        function stepMonth(direction) {
            if (!reportData) return;
            const months = Object.keys(reportData.monthly_spending || {}).sort();
            const idx = months.indexOf(selectedMonth);
            if (idx === -1) return;
            const targetIdx = idx + direction;
            if (targetIdx >= 0 && targetIdx < months.length) {
                selectDrillDownMonth(months[targetIdx]);
            }
        }

        // Render Annual Category Group and Ranked Categories in-place
        async function renderAnnualSection(targetYear) {
            annualSectionYear = targetYear;
            updateAnnualYearNavButtons();

            const yearBadgeEl = document.getElementById('annualYearBadge');
            const subTitleEl = document.getElementById('annualCatGroupSubtitle');
            const totalEl = document.getElementById('annualSpendTotal');
            const rankedTitleEl = document.getElementById('annualRankedCatsTitle');
            const groupContainer = document.getElementById('groupListContainer');
            const yearChipsContainer = document.getElementById('yearChipsContainer');

            if (yearBadgeEl) yearBadgeEl.textContent = `${targetYear}`;
            if (rankedTitleEl) rankedTitleEl.textContent = `${targetYear}`;

            // Render Year Chips
            if (yearChipsContainer) {
                yearChipsContainer.innerHTML = '';
                const sortedYears = [...availableYears].sort((a, b) => b - a);
                sortedYears.forEach(y => {
                    const isSelected = (y === targetYear);
                    const chip = document.createElement('button');
                    chip.className = `month-chip ${isSelected ? 'active' : ''}`;
                    chip.textContent = y;
                    chip.title = `View ${y} spending by category`;
                    chip.onclick = () => renderAnnualSection(y);
                    yearChipsContainer.appendChild(chip);

                    if (isSelected && yearChipsContainer.parentElement) {
                        const wrapper = yearChipsContainer.parentElement;
                        requestAnimationFrame(() => {
                            const chipLeft = chip.offsetLeft;
                            const chipWidth = chip.offsetWidth;
                            const wrapperWidth = wrapper.clientWidth;
                            wrapper.scrollTo({
                                left: chipLeft - (wrapperWidth / 2) + (chipWidth / 2),
                                behavior: 'smooth'
                            });
                        });
                    }
                });
            }

            // Check if year data is cached in memory
            let data = cachedAnnualReports[targetYear];
            if (!data) {
                try {
                    const res = await fetch(`/api/spending?year=${targetYear}`);
                    if (res.ok) {
                        data = await res.json();
                        if (data.status === 'ok') {
                            cachedAnnualReports[targetYear] = data;
                            if (data.category_to_group) {
                                categoryToGroupMap = Object.assign({}, categoryToGroupMap, data.category_to_group);
                            }
                        }
                    }
                } catch (e) {
                    console.warn(`Could not fetch data for year ${targetYear}`, e);
                }
            }

            // Ensure prior year data is fetched for Y/Y comparison
            const prevTargetYear = targetYear - 1;
            let prevData = cachedAnnualReports[prevTargetYear];
            if (prevData === undefined && targetYear > 2000) {
                try {
                    const prevRes = await fetch(`/api/spending?year=${prevTargetYear}`);
                    if (prevRes.ok) {
                        const pData = await prevRes.json();
                        if (pData.status === 'ok') {
                            prevData = pData;
                            cachedAnnualReports[prevTargetYear] = pData;
                            if (pData.category_to_group) {
                                categoryToGroupMap = Object.assign({}, categoryToGroupMap, pData.category_to_group);
                            }
                        } else {
                            cachedAnnualReports[prevTargetYear] = null;
                        }
                    } else {
                        cachedAnnualReports[prevTargetYear] = null;
                    }
                } catch (e) {
                    cachedAnnualReports[prevTargetYear] = null;
                }
            }

            if (!data || data.status === 'not_found' || !data.summary) {
                if (subTitleEl) subTitleEl.textContent = '';
                if (totalEl) totalEl.innerHTML = `<span class="total-prefix">Total: </span>$0.00`;
                if (groupContainer) groupContainer.innerHTML = '<div style="color:var(--text-muted); padding:1rem;">No category data for this year</div>';
                renderCategoryTable({}, 0);
                if (groupChart) groupChart.clear();
                return;
            }

            const sum = data.summary || {};
            const totalExpense = sum.total_expense || 0;
            const catGroups = data.category_groups || {};
            const cats = data.categories || {};
            const hasPrevYear = prevData && (prevData.summary?.total_expense || 0) > 0;

            if (totalEl) totalEl.innerHTML = `<span class="total-prefix">Total: </span>${formatCurrency(totalExpense)}`;
            if (subTitleEl) {
                subTitleEl.textContent = hasPrevYear ? `Y/Y vs ${prevTargetYear} (% of total spend)` : '';
            }

            // Populate Category Groups List with Y/Y comparison
            if (groupContainer) {
                groupContainer.innerHTML = '';
                const sortedGroups = Object.entries(catGroups).sort((a, b) => b[1] - a[1]);
                const prevTotalExpense = prevData?.summary?.total_expense || 0;
                const prevCatGroups = prevData?.category_groups || {};

                sortedGroups.forEach(([name, amt], idx) => {
                    const pct = totalExpense > 0 ? (amt / totalExpense) * 100 : 0;
                    const color = GROUP_COLORS[idx % GROUP_COLORS.length];

                    let yyBadge = '';
                    if (hasPrevYear) {
                        const prevAmt = prevCatGroups[name] || 0;
                        const prevPct = (prevAmt / prevTotalExpense) * 100;
                        const delta = pct - prevPct;

                        if (Math.abs(delta) < 0.05) {
                            yyBadge = `, <span style="color:var(--text-muted); font-size:0.75rem;" title="${prevTargetYear}: ${prevPct.toFixed(1)}% (0.0% change)">0.0%</span>`;
                        } else if (delta > 0) {
                            yyBadge = `, <span style="color:#10b981; font-weight:600; font-size:0.75rem;" title="${prevTargetYear}: ${prevPct.toFixed(1)}% (increased +${delta.toFixed(1)}% of spending)">▲ +${delta.toFixed(1)}%</span>`;
                        } else {
                            yyBadge = `, <span style="color:#f43f5e; font-weight:600; font-size:0.75rem;" title="${prevTargetYear}: ${prevPct.toFixed(1)}% (decreased -${Math.abs(delta).toFixed(1)}% of spending)">🔻${Math.abs(delta).toFixed(1)}%</span>`;
                        }
                    }

                    const item = document.createElement('div');
                    item.className = 'group-item';
                    item.innerHTML = `
                        <div class="group-header">
                            <span class="group-name">
                                <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${color}; flex-shrink:0;"></span>
                                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${name}</span>
                            </span>
                            <div class="group-amount-wrap">
                                <span class="group-amount-val">${formatCurrency(amt)}</span>
                                <span class="group-amount-pct">(${pct.toFixed(1)}%${yyBadge})</span>
                            </div>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${Math.min(pct, 100)}%; background: ${color};"></div>
                        </div>
                    `;
                    groupContainer.appendChild(item);
                });

                // Render Donut Chart with correct Y/Y target year
                renderGroupDonutChart(sortedGroups, prevData, totalExpense, targetYear);
            }

            // Populate Annual Categories Table
            const searchInput = document.getElementById('categorySearch');
            const query = searchInput ? searchInput.value : '';
            renderCategoryTable(cats, totalExpense, query);
        }

        function stepAnnualYear(direction) {
            const sorted = [...availableYears].sort((a, b) => a - b);
            const idx = sorted.indexOf(annualSectionYear);
            if (idx === -1) return;
            const targetIdx = idx + direction;
            if (targetIdx >= 0 && targetIdx < sorted.length) {
                renderAnnualSection(sorted[targetIdx]);
            }
        }

        function updateAnnualYearNavButtons() {
            const sorted = [...availableYears].sort((a, b) => a - b);
            const idx = sorted.indexOf(annualSectionYear);
            const prevBtn = document.getElementById('prevYearBtn');
            const nextBtn = document.getElementById('nextYearBtn');
            if (prevBtn) prevBtn.disabled = (idx <= 0);
            if (nextBtn) nextBtn.disabled = (idx >= sorted.length - 1);
        }

        function updateMonthlyChartSelection() {
            if (!monthlyChart || !reportData) return;
            const monthly = reportData.monthly_spending || {};
            const months = Object.keys(monthly).sort();
            const barData = months.map(m => {
                const isSelected = (m === selectedMonth);
                return {
                    value: monthly[m],
                    itemStyle: isSelected ? {
                        borderRadius: [6, 6, 0, 0],
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#ec4899' },
                            { offset: 1, color: '#f43f5e' }
                        ]),
                        borderColor: '#fda4af',
                        borderWidth: 2,
                        shadowColor: 'rgba(244, 63, 94, 0.4)',
                        shadowBlur: 8
                    } : {
                        borderRadius: [6, 6, 0, 0],
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#818cf8' },
                            { offset: 1, color: '#4f46e5' }
                        ])
                    }
                };
            });
            monthlyChart.setOption({
                series: [{
                    name: 'Spending',
                    data: barData
                }]
            });
        }

        // Render Ranked Category Table (Annual)
        function renderCategoryTable(cats, totalExpense, filterQuery = '') {
            const tbody = document.getElementById('categoryTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            let sorted = Object.entries(cats).sort((a, b) => b[1] - a[1]);
            if (filterQuery.trim()) {
                const q = filterQuery.toLowerCase();
                sorted = sorted.filter(([name]) => {
                    const grp = (categoryToGroupMap[name] || '').toLowerCase();
                    return name.toLowerCase().includes(q) || grp.includes(q);
                });
            }

            if (sorted.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:2rem;">No matching categories found</td></tr>`;
                return;
            }

            sorted.forEach(([name, amt], idx) => {
                const pct = totalExpense > 0 ? (amt / totalExpense) * 100 : 0;
                const groupName = categoryToGroupMap[name] || '';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="rank">${idx + 1}</td>
                    <td class="name">
                        <span>${name}</span>
                        ${groupName ? `<span class="cat-group-name">${groupName}</span>` : ''}
                    </td>
                    <td class="amount">${formatCurrency(amt)}</td>
                    <td class="pct">${pct.toFixed(1)}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterCategories() {
            const data = cachedAnnualReports[annualSectionYear] || reportData;
            if (!data) return;
            const query = document.getElementById('categorySearch').value;
            const sum = data.summary || {};
            renderCategoryTable(data.categories || {}, sum.total_expense || 0, query);
        }

        // Render Monthly Bar Chart with Average Line for Completed Months
        function renderMonthlyChart(monthly, year) {
            const chartDom = document.getElementById('monthlyChart');
            if (!chartDom) return;
            if (monthlyChart) monthlyChart.dispose();
            monthlyChart = echarts.init(chartDom);

            const months = Object.keys(monthly).sort();

            // Calculate completed months
            const now = new Date();
            const realYear = now.getFullYear();
            const realMonth = now.getMonth() + 1; // 1..12
            const currentMonthPrefix = `${realYear}-${String(realMonth).padStart(2, '0')}`;

            let completedMonths = [];
            if (year < realYear) {
                // Past years: all months in the dataset are completed
                completedMonths = months;
            } else if (year === realYear) {
                // Current year: strictly prior to current month (e.g. before August)
                completedMonths = months.filter(m => m < currentMonthPrefix);
            } else {
                // Future years: no completed months
                completedMonths = [];
            }

            let avgSpend = null;
            let avgLabelText = '';
            if (completedMonths.length > 0) {
                const totalCompletedSpend = completedMonths.reduce((acc, m) => acc + (monthly[m] || 0), 0);
                avgSpend = totalCompletedSpend / completedMonths.length;
                const startM = completedMonths[0].substring(5);
                const endM = completedMonths[completedMonths.length - 1].substring(5);
                const monthNames = ["", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                const rangeStr = completedMonths.length === 1
                    ? monthNames[parseInt(startM, 10)]
                    : `${monthNames[parseInt(startM, 10)]}–${monthNames[parseInt(endM, 10)]}`;
                avgLabelText = `Avg: ${formatCurrency(avgSpend)}/mo (${rangeStr})`;
            }

            // Update badge on section header
            const badgeEl = document.getElementById('monthlyAvgBadge');
            if (badgeEl) {
                if (avgSpend !== null) {
                    badgeEl.style.display = 'inline-flex';
                    badgeEl.textContent = avgLabelText;
                } else {
                    badgeEl.style.display = 'none';
                }
            }

            const barData = months.map(m => {
                const isSelected = (m === selectedMonth);
                return {
                    value: monthly[m],
                    itemStyle: isSelected ? {
                        borderRadius: [6, 6, 0, 0],
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#ec4899' },
                            { offset: 1, color: '#f43f5e' }
                        ]),
                        borderColor: '#fda4af',
                        borderWidth: 2,
                        shadowColor: 'rgba(244, 63, 94, 0.4)',
                        shadowBlur: 8
                    } : {
                        borderRadius: [6, 6, 0, 0],
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#818cf8' },
                            { offset: 1, color: '#4f46e5' }
                        ])
                    }
                };
            });

            const seriesObj = {
                name: 'Spending',
                type: 'bar',
                barWidth: '45%',
                data: barData
            };

            if (avgSpend !== null) {
                seriesObj.markLine = {
                    silent: false,
                    symbol: ['none', 'none'],
                    lineStyle: {
                        type: 'dashed',
                        color: '#f59e0b',
                        width: 2,
                        dashOffset: 4
                    },
                    label: {
                        show: true,
                        position: 'insideEndTop',
                        formatter: `Avg: ${formatCurrency(avgSpend)}`,
                        color: '#fbbf24',
                        fontSize: 11,
                        fontWeight: 'bold',
                        backgroundColor: 'rgba(15, 15, 26, 0.9)',
                        borderColor: 'rgba(245, 158, 11, 0.5)',
                        borderWidth: 1,
                        borderRadius: 4,
                        padding: [3, 6]
                    },
                    data: [
                        {
                            yAxis: avgSpend,
                            name: 'Completed Months Average'
                        }
                    ]
                };
            }

            const option = {
                tooltip: {
                    trigger: 'axis',
                    formatter: (params) => {
                        let res = `<b>${params[0].name}</b><br/>`;
                        params.forEach(p => {
                            if (p.seriesName === 'Spending') {
                                res += `Spend: ${formatCurrency(p.value)}`;
                            }
                        });
                        return res;
                    }
                },
                grid: { left: '3%', right: '4%', bottom: '3%', top: '12%', containLabel: true },
                xAxis: {
                    type: 'category',
                    data: months,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.15)' } },
                    axisLabel: { color: 'rgba(255,255,255,0.6)' }
                },
                yAxis: {
                    type: 'value',
                    axisLine: { show: false },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } },
                    axisLabel: {
                        color: 'rgba(255,255,255,0.6)',
                        formatter: (v) => '$' + (v >= 1000 ? (v / 1000).toFixed(0) + 'k' : v)
                    }
                },
                series: [seriesObj]
            };
            monthlyChart.setOption(option);
            monthlyChart.off('click');
            monthlyChart.on('click', (params) => {
                const clickedMonth = months[params.dataIndex] || params.name;
                if (clickedMonth) {
                    selectDrillDownMonth(clickedMonth);
                    const drillDownEl = document.getElementById('monthlyDrillDownCard');
                    if (drillDownEl && window.innerWidth <= 768) {
                        drillDownEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }
            });
        }

        // Render Group Donut Chart with Y/Y Comparison Tooltip
        function renderGroupDonutChart(sortedGroups, prevYearData = null, totalExpense = 0, targetYear = annualSectionYear) {
            const chartDom = document.getElementById('groupDonutChart');
            if (!chartDom) return;
            if (groupChart) groupChart.dispose();
            groupChart = echarts.init(chartDom);

            const prevTotalExpense = prevYearData?.summary?.total_expense || 0;
            const prevCatGroups = prevYearData?.category_groups || {};

            const data = sortedGroups.map(([name, value], idx) => ({
                name,
                value,
                itemStyle: { color: GROUP_COLORS[idx % GROUP_COLORS.length] }
            }));

            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: (p) => {
                        let res = `<b>${p.name}</b><br/>${formatCurrency(p.value)} (${p.percent}%)`;
                        if (prevYearData && prevTotalExpense > 0) {
                            const prevAmt = prevCatGroups[p.name] || 0;
                            const prevPct = (prevAmt / prevTotalExpense) * 100;
                            const delta = p.percent - prevPct;
                            if (delta > 0.05) {
                                res += `<br/><span style="color:#10b981; font-size:0.85em;">▲ +${delta.toFixed(1)}% vs ${targetYear - 1} (${prevPct.toFixed(1)}%)</span>`;
                            } else if (delta < -0.05) {
                                res += `<br/><span style="color:#f43f5e; font-size:0.85em;">🔻${Math.abs(delta).toFixed(1)}% vs ${targetYear - 1} (${prevPct.toFixed(1)}%)</span>`;
                            }
                        }
                        return res;
                    }
                },
                series: [{
                    name: 'Category Group',
                    type: 'pie',
                    radius: ['45%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 6,
                        borderColor: '#0f0f1a',
                        borderWidth: 2
                    },
                    label: { show: false },
                    data: data
                }]
            };
            groupChart.setOption(option);
        }

        // Trigger Refresh from Hamburger Menu
        async function triggerRefreshFromMenu(e) {
            if (e) e.stopPropagation();
            const dropdown = document.getElementById('menuDropdown');
            if (dropdown) dropdown.classList.remove('show');
            await triggerRecalculate();
        }

        // Trigger Recalculate / Background Sync
        async function triggerRecalculate() {
            setSyncingState(true);
            try {
                const res = await fetch(`/api/spending/recalculate?year=${currentYear}`, { method: 'POST' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                startPolling();
            } catch (err) {
                alert(`Could not start refresh: ${err.message}`);
                setSyncingState(false);
            }
        }

        function setSyncingState(syncing) {
            isSyncing = syncing;
            const menuBtn = document.getElementById('menuRefreshBtn');
            const menuIcon = document.getElementById('menuRefreshIcon');
            const menuText = document.getElementById('menuRefreshText');
            const fContainer = document.getElementById('freshnessContainer');

            if (syncing) {
                if (menuBtn) menuBtn.disabled = true;
                if (menuIcon) menuIcon.innerHTML = '<div class="spinner" style="width:12px; height:12px; border-width:2px;"></div>';
                if (menuText) menuText.textContent = 'Refreshing data...';
                if (fContainer) {
                    fContainer.innerHTML = `
                        <div class="freshness-pill syncing" title="Querying Monarch Money for ${currentYear} transactions">
                            <span class="spinner" style="width:10px; height:10px; border-width:2px; margin-right:4px;"></span>
                            <span>Refreshing data with Monarch...</span>
                        </div>
                    `;
                }
            } else {
                if (menuBtn) menuBtn.disabled = false;
                if (menuIcon) menuIcon.textContent = '🔄';
                if (menuText) menuText.textContent = 'Refresh Data';
                if (reportData && reportData.status === 'ok') {
                    const freshness = getFreshnessDetails(reportData.updated_at, currentYear);
                    if (fContainer) fContainer.innerHTML = freshness.pillHtml;
                }
            }
        }

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(async () => {
                try {
                    const res = await fetch(`/api/spending/status?year=${currentYear}`);
                    if (!res.ok) return;
                    const statusData = await res.json();

                    if (statusData.sync_status === 'ready') {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        await loadReport(currentYear);
                    } else if (statusData.sync_status === 'error') {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        setSyncingState(false);
                        alert(`Recalculation error: ${statusData.error_message || 'Unknown error'}`);
                    }
                } catch (e) {
                    console.error('Polling status error', e);
                }
            }, 2500);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
